<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>LUU-AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 2C55 37 63 45 98 50C63 55 55 63 50 98C45 63 37 55 2 50C37 45 45 37 50 2Z' fill='%238ec2f0'/%3E%3C/svg%3E">
<style>
/* ============ 基础变量 ============ */
:root{
  --fs-base:16px;
  --fs-xs:calc(var(--fs-base)*.72);
  --fs-sm:calc(var(--fs-base)*.84);
  --fs-md:var(--fs-base);
  --fs-lg:calc(var(--fs-base)*1.15);
  --fs-xl:calc(var(--fs-base)*1.4);
  --fs-clock:calc(var(--fs-base)*3.9);
  --blue:#8ec2f0;
  --blue2:#5f9fdd;
  --blue-soft:#dcEbfd;
  --bg:#eef5fc;
  --bg2:#e2edf9;
  --card:#ffffff;
  --ink:#22384c;
  --ink2:#7e99b1;
  --line:var(--blue);
  --bubble-ai:#ffffff;
  --bubble-me:#dcebfd;
  --danger:#e88a90;
  --shadow:0 4px 18px rgba(95,159,221,.10);
}
body[data-theme="night"]{
  --blue:#79b6ea;
  --blue2:#8cc4f2;
  --blue-soft:#1a2940;
  --bg:#0a0b0d;
  --bg2:#101317;
  --card:#14171b;
  --ink:#edf1f5;
  --ink2:#76818c;
  --bubble-ai:#16191e;
  --bubble-me:#1b2b44;
  --shadow:0 4px 18px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  background:#c9d9ea;display:flex;align-items:center;justify-content:center;
  color:var(--ink);font-size:var(--fs-base);
  overscroll-behavior:none;
}
body[data-theme="night"]{background:#000}
button{font-family:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:var(--fs-md);color:var(--ink)}
img{-webkit-user-drag:none}

/* ============ 手机容器 ============ */
#phone{
  position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;
  background:var(--bg);transition:background .3s;
}
@media (min-width:560px) and (min-height:720px){
  #phone{width:412px;height:min(900px,96dvh);border-radius:40px;
    box-shadow:0 30px 90px rgba(25,55,95,.30),0 0 0 10px rgba(255,255,255,.55)}
  body[data-theme="night"] #phone{box-shadow:0 30px 90px rgba(0,0,0,.8),0 0 0 10px rgba(255,255,255,.08)}
}

/* ============ 通用屏幕 ============ */
.screen,.app-layer,.page{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg)}
.screen{z-index:1}
.app-layer{z-index:10}
.screen.active,.app-layer.open,.page.open{display:flex}
.pressable{transition:transform .12s}
.pressable:active{transform:scale(.92)}

/* ============ 锁屏 ============ */
#scr-lock{background:linear-gradient(180deg,#e8f2fc 0%,#d5e6f7 60%,#c9ddf3 100%);align-items:center;justify-content:space-between;padding:70px 24px 46px;touch-action:none;user-select:none}
body[data-theme="night"] #scr-lock{background:linear-gradient(180deg,#0a0b0d,#101319)}
#lock-inner{display:flex;flex-direction:column;align-items:center;width:100%;transition:transform .25s}
.lock-time{font-size:var(--fs-clock);font-weight:200;letter-spacing:2px;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.lock-date{margin-top:12px;font-size:var(--fs-sm);color:var(--ink2);letter-spacing:1px}
.lock-star{margin:auto 0;width:150px;height:150px;display:flex;align-items:center;justify-content:center;position:absolute;left:50%;top:50%;transform:translate(-50%,-52%)}
.lock-star svg{width:100%;height:100%;animation:breathe 3.2s ease-in-out infinite;filter:drop-shadow(0 0 14px rgba(142,194,240,.55))}
.lock-star path{fill:none;stroke:var(--blue);stroke-width:2.4}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.14);opacity:1}}
.lock-hint{font-size:var(--fs-xs);color:var(--ink2);letter-spacing:4px;margin-bottom:14px}
#lock-arrow{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--blue2)}
#lock-arrow svg{width:26px;height:26px;animation:floatUp 1.6s ease-in-out infinite}
#lock-arrow path{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
@keyframes floatUp{0%,100%{transform:translateY(6px);opacity:.35}50%{transform:translateY(-6px);opacity:1}}

/* ============ 密码页 ============ */
#scr-pass{align-items:center;justify-content:center;padding:64px 24px 30px;background:var(--bg);overflow-y:auto}
#pass-back{position:absolute;left:16px;top:18px;color:var(--ink2);display:flex;align-items:center;gap:4px;font-size:var(--fs-sm)}
#pass-back svg{width:18px;height:18px}
#pass-back path{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pass-star{width:44px;height:44px;margin-bottom:6px}
.pass-star path{fill:none;stroke:var(--blue);stroke-width:3}
.pass-title{font-size:var(--fs-md);color:var(--ink);margin:6px 0 22px;letter-spacing:2px}
#pass-dots{display:flex;gap:18px;height:16px;align-items:center;margin-bottom:8px}
#pass-dots .dot{width:14px;height:14px;border-radius:50%;border:1.6px solid var(--blue2);transition:all .15s}
#pass-dots .dot.on{background:var(--blue2);transform:scale(1.12)}
#pass-dots.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(5px)}}
#pass-err{height:20px;font-size:var(--fs-xs);color:var(--danger);opacity:0;transition:opacity .2s}
#pass-err.show{opacity:1}
#pass-pad{margin-top:22px;display:grid;grid-template-columns:repeat(3,74px);gap:16px;justify-content:center}
.pkey{
  width:74px;height:74px;border-radius:50%;font-size:calc(var(--fs-base)*1.5);font-weight:300;color:var(--ink);
  background:linear-gradient(160deg,rgba(142,194,240,.16),rgba(142,194,240,.30));
  border:1.6px solid var(--blue);display:flex;align-items:center;justify-content:center;
  transition:transform .1s,background .15s;
}
.pkey:active{transform:scale(.9);background:rgba(142,194,240,.45)}
.pkey svg{width:26px;height:26px}
.pkey path{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pkey.ghost{visibility:hidden}

/* ============ 主屏 ============ */
#scr-home{overflow:hidden}
#home-bg{position:absolute;inset:0;background:linear-gradient(180deg,#d9e7f6 0%,#c6dcf0 100%);overflow:hidden}
body[data-theme="night"] #home-bg{background:linear-gradient(180deg,#0b0d10,#121721)}
.bg-lines{position:absolute;inset:0;width:100%;height:100%}
.bg-lines path{fill:none;stroke:var(--blue);stroke-width:1;opacity:.16;stroke-dasharray:5 9;animation:flow 26s linear infinite}
@keyframes flow{to{stroke-dashoffset:-560}}
.bg-star{position:absolute;animation:twinkle var(--tw,3s) ease-in-out infinite alternate}
.bg-star path{fill:#fff;opacity:var(--o,.85)}
body[data-theme="day"] .bg-star path{fill:#fff;opacity:calc(var(--o,.85)*.95)}
@keyframes twinkle{from{transform:scale(.75);opacity:.35}to{transform:scale(1.05)}}
.home-top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:flex-start;padding:26px 24px 0}
.home-time{font-size:var(--fs-xl);font-weight:300;color:var(--ink);font-variant-numeric:tabular-nums}
.home-date{font-size:var(--fs-xs);color:var(--ink2);margin-top:3px}
.home-brand{display:flex;align-items:center;gap:5px;color:var(--blue2);font-size:var(--fs-xs);letter-spacing:2px}
.home-brand svg{width:13px;height:13px}
.home-brand path{fill:currentColor}
.app-grid{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);gap:22px 8px;padding:0 22px;margin-bottom:clamp(40px,9dvh,76px);flex-shrink:0}
.app-cell{display:flex;flex-direction:column;align-items:center;gap:0}
.app-star{width:15px;height:15px;margin-bottom:7px;animation:twinkle 2.6s ease-in-out infinite alternate}
.app-star path{fill:var(--blue2)}
.app-icon{
  width:66px;height:66px;border-radius:20px;background:var(--card);border:1.5px solid var(--blue);
  box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;position:relative;
}
.app-icon svg{width:36px;height:36px;color:var(--blue2)}
.app-icon .badge{
  position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;
  background:var(--danger);color:#fff;font-size:11px;display:none;align-items:center;justify-content:center;font-weight:600;
}
.app-icon .badge.show{display:flex}
.app-label{margin-top:8px;font-size:var(--fs-xs);color:var(--blue2);letter-spacing:1px}

/* ============ 微信 App ============ */
.app-head{
  padding:16px 16px 10px;display:flex;align-items:center;gap:6px;
  border-bottom:1px solid color-mix(in srgb,var(--blue) 35%,transparent);background:var(--bg);
}
.h-back{color:var(--blue2);display:flex;align-items:center;padding:2px 4px 2px 0;flex-shrink:0}
.h-back svg{width:23px;height:23px}
.h-back path{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.app-head .app-title{flex:1;min-width:0}
.app-title{font-size:var(--fs-lg);font-weight:600}
.wc-plus{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--blue);color:var(--blue2);display:flex;align-items:center;justify-content:center}
.wc-plus svg{width:16px;height:16px}
.wc-plus path{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.wc-tabs{display:flex;border-bottom:1px solid color-mix(in srgb,var(--blue) 30%,transparent);background:var(--bg)}
.wc-tab{flex:1;text-align:center;padding:9px 0;font-size:var(--fs-sm);color:var(--ink2);position:relative}
.wc-tab.active{color:var(--blue2);font-weight:600}
.wc-tab.active::after{content:'';position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:26px;height:3px;border-radius:2px;background:var(--blue2)}
.wc-body{flex:1;overflow-y:auto;padding:6px 0 20px}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;position:relative;transition:background .15s}
.row:active{background:var(--bg2)}
.ava{width:46px;height:46px;border-radius:50%;object-fit:cover;border:1.5px solid var(--blue);background:var(--card);flex-shrink:0}
.ava-sq{border-radius:12px}
.row-main{flex:1;min-width:0}
.row-name{font-size:var(--fs-md);color:var(--ink)}
.row-sub{font-size:var(--fs-xs);color:var(--ink2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-time{font-size:var(--fs-xs);color:var(--ink2);align-self:flex-start;margin-top:12px}
.u-badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;position:absolute;right:14px;top:50%;transform:translateY(-50%)}
.u-badge.inrow{position:static;transform:none;margin-left:8px}
.empty-tip{text-align:center;color:var(--ink2);font-size:var(--fs-sm);padding:40px 30px;line-height:1.8}

/* ============ 聊天页 ============ */
#page-chat{z-index:30;transform:translateX(100%);transition:transform .28s cubic-bezier(.3,.9,.3,1);display:flex}
#page-chat.open{transform:translateX(0)}

/* 聊天信息页 */
#page-chatinfo{z-index:32;transform:translateX(100%);transition:transform .28s cubic-bezier(.3,.9,.3,1)}
#page-chatinfo.open{transform:translateX(0)}
.ci-body{flex:1;overflow-y:auto;padding:18px 16px 30px}
.ci-profile{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:16px}
#ci-ava{width:84px;height:84px;border-radius:50%;object-fit:cover;border:2px solid var(--blue);background:var(--card);cursor:pointer}
.ci-hint{font-size:var(--fs-xs);color:var(--ink2)}
.ci-wall{display:flex;gap:10px;align-items:center}
.ci-wall img{width:56px;height:56px;object-fit:cover;border-radius:12px;border:1.5px solid var(--blue)}
.ci-wall .wall-empty{width:56px;height:56px;border-radius:12px;border:1.5px dashed var(--blue);display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:10px;text-align:center;background:var(--card)}
.ci-wallbtns{display:flex;gap:8px;flex-wrap:wrap}
.ci-wallbtns .btn{padding:7px 14px}
.chat-head{
  padding:16px 12px 10px;display:flex;align-items:center;gap:8px;
  border-bottom:1px solid color-mix(in srgb,var(--blue) 35%,transparent);background:var(--bg);z-index:3;
}
.ch-back{color:var(--blue2);display:flex;align-items:center;padding:4px}
.ch-back svg{width:22px;height:22px}
.ch-back path{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ch-name{flex:1;text-align:center;font-size:var(--fs-md);color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-more{color:var(--ink2);padding:4px 8px;letter-spacing:2px;font-weight:700;font-size:var(--fs-lg)}
.chat-body{
  flex:1;overflow-y:auto;padding:14px 12px 10px;position:relative;background:var(--bg);
  background-size:cover;background-position:center;
}
.chat-body.has-wall::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.45);pointer-events:none}
body[data-theme="day"] .chat-body.has-wall::after{background:rgba(255,255,255,.06)}
.chat-inner{position:relative;z-index:2;display:flex;flex-direction:column}
.msg-date{text-align:center;font-size:var(--fs-xs);color:var(--ink2);margin:12px 0 6px}
.msg{display:flex;gap:9px;margin:9px 0;align-items:flex-start}
.msg .ava{width:38px;height:38px}
.msg.me{flex-direction:row-reverse}
.bubble{
  position:relative;max-width:70%;padding:9px 13px;border-radius:18px;font-size:var(--fs-md);line-height:1.55;
  word-break:break-word;white-space:pre-wrap;
}
.msg.ai .bubble{background:var(--bubble-ai);border:1.5px solid var(--blue);border-top-left-radius:6px;color:var(--ink)}
.msg.me .bubble{background:var(--bubble-me);border:1.5px solid var(--blue);border-top-right-radius:6px;color:var(--ink)}
.msg.ai .bubble::before{
  content:'';position:absolute;left:-6.5px;top:10px;width:11px;height:11px;background:var(--bubble-ai);
  border-left:1.5px solid var(--blue);border-bottom:1.5px solid var(--blue);transform:rotate(45deg);border-bottom-left-radius:3px;
}
.msg.me .bubble::before{
  content:'';position:absolute;right:-6.5px;top:10px;width:11px;height:11px;background:var(--bubble-me);
  border-right:1.5px solid var(--blue);border-top:1.5px solid var(--blue);transform:rotate(45deg);border-top-right-radius:3px;
}
.msg-img{max-width:170px;border-radius:10px;display:block;cursor:pointer}
.stk{width:110px;border-radius:10px;display:block;cursor:pointer}
.msg.note-msg{justify-content:center}
.msg-note{
  text-align:center;font-size:var(--fs-xs);color:var(--ink2);background:color-mix(in srgb,var(--blue) 12%,transparent);
  padding:4px 14px;border-radius:20px;max-width:86%;
}
.t-card{min-width:180px}
.t-card .t-top{display:flex;align-items:baseline;gap:5px;font-size:var(--fs-xl);font-weight:600}
.t-card .t-y{font-size:var(--fs-sm);font-weight:400}
.t-card .t-note{font-size:var(--fs-xs);color:var(--ink2);margin-top:5px;border-top:1px solid color-mix(in srgb,var(--blue) 30%,transparent);padding-top:5px}
#typing{display:none;margin:9px 0}
#typing.show{display:flex}
.tdots{display:flex;gap:5px;padding:13px 16px}
.tdots i{width:7px;height:7px;border-radius:50%;background:var(--blue2);animation:td 1.1s infinite}
.tdots i:nth-child(2){animation-delay:.18s}
.tdots i:nth-child(3){animation-delay:.36s}
@keyframes td{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}

/* 输入区 */
.chat-panelwrap{background:var(--bg);border-top:1px solid color-mix(in srgb,var(--blue) 25%,transparent)}
.panel{display:none;padding:14px;max-height:240px;overflow-y:auto}
.panel.open{display:block;animation:slideUp .22s ease-out}
@keyframes slideUp{from{transform:translateY(14px);opacity:.4}to{transform:none;opacity:1}}
.pa-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pa-item{display:flex;flex-direction:column;align-items:center;gap:7px}
.pa-ico{width:52px;height:52px;border-radius:16px;background:var(--card);border:1.5px solid var(--blue);display:flex;align-items:center;justify-content:center;color:var(--blue2)}
.pa-ico svg{width:26px;height:26px}
.pa-item span{font-size:var(--fs-xs);color:var(--ink2)}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.emoji-grid button{font-size:calc(var(--fs-base)*1.35);padding:5px 0;border-radius:8px}
.emoji-grid button:active{background:var(--bg2)}
.stk-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stk-cell img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1.5px solid var(--blue);background:var(--card)}
.stk-add{border:1.5px dashed var(--blue);border-radius:10px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--blue2);gap:4px;background:var(--card)}
.stk-add svg{width:22px;height:22px}
.stk-add path{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.stk-add span{font-size:10px;color:var(--ink2)}
.stk-mean{font-size:10px;color:var(--ink2);text-align:center;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-bar{
  display:flex;align-items:center;gap:8px;padding:9px 10px calc(9px + env(safe-area-inset-bottom));
  background:var(--bg);border-top:1px solid color-mix(in srgb,var(--blue) 25%,transparent);
}
.cb-plus{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--blue);color:var(--blue2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cb-plus svg{width:16px;height:16px}
.cb-plus path{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
#cb-input{flex:1;min-width:0;border:1.5px solid var(--blue);background:var(--card);border-radius:20px;padding:8px 14px;outline:none}
#cb-input:focus{border-color:var(--blue2)}
.cb-ico{width:32px;height:32px;color:var(--ink2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cb-ico svg{width:24px;height:24px}
.cb-ico path{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.cb-ico.on{color:var(--blue2)}
#cb-send{background:var(--blue2);color:#fff;border-radius:18px;padding:7px 15px;font-size:var(--fs-sm);flex-shrink:0}

/* ============ 朋友圈 ============ */
#page-moments{z-index:28;transform:translateY(100%);transition:transform .3s cubic-bezier(.3,.9,.3,1)}
#page-moments.open{transform:translateY(0)}
.mm-head{position:relative;height:250px;flex-shrink:0}
#mm-bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mm-head .default-bg{position:absolute;inset:0;background:linear-gradient(180deg,#bcd6ee,#93bce2)}
.mm-head .default-bg svg{position:absolute;width:100%;height:100%}
.mm-cover{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(20,40,70,.36))}
.mm-topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:16px 14px;z-index:3}
.mm-topbar button{color:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.35));display:flex}
.mm-topbar svg{width:24px;height:24px}
.mm-topbar path{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#mm-changebg{position:absolute;right:12px;bottom:70px;z-index:3;font-size:11px;color:#fff;background:rgba(0,0,0,.3);padding:4px 10px;border-radius:14px;backdrop-filter:blur(4px)}
.mm-me{position:absolute;left:14px;bottom:-24px;display:flex;align-items:flex-end;gap:12px;z-index:3}
.mm-ava{width:64px;height:64px;border-radius:14px;object-fit:cover;border:2px solid #fff;box-shadow:var(--shadow);background:var(--card)}
.mm-name{color:#fff;font-size:var(--fs-lg);font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.4);margin-bottom:2px}
.mm-list{flex:1;overflow-y:auto;background:var(--bg);padding:40px 0 30px}
.post{padding:14px 16px;border-bottom:1px solid color-mix(in srgb,var(--blue) 18%,transparent)}
.post-top{display:flex;gap:11px}
.p-ava{width:42px;height:42px;border-radius:10px;object-fit:cover;border:1.5px solid var(--blue);background:var(--card)}
.p-main{flex:1;min-width:0}
.p-name{color:var(--blue2);font-weight:600;font-size:var(--fs-sm)}
.p-text{margin-top:4px;font-size:var(--fs-md);line-height:1.6;white-space:pre-wrap;word-break:break-word}
.p-text .at{color:var(--blue2)}
.p-imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px;max-width:290px}
.p-imgs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer;border:1px solid color-mix(in srgb,var(--blue) 40%,transparent)}
.p-foot{display:flex;align-items:center;justify-content:space-between;margin-top:9px}
.p-time{font-size:var(--fs-xs);color:var(--ink2)}
.p-more{color:var(--blue2);background:color-mix(in srgb,var(--blue) 16%,transparent);border-radius:8px;padding:2px 9px;font-weight:700;letter-spacing:1px}
.p-actions{display:none;justify-content:flex-end;gap:8px;margin-top:9px}
.p-actions.open{display:flex}
.p-act{font-size:var(--fs-xs);border:1.5px solid var(--blue);border-radius:14px;padding:4px 12px;color:var(--blue2);background:var(--card)}
.p-act.del{color:var(--danger);border-color:var(--danger)}
.p-likes{display:flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--blue) 10%,transparent);border-radius:8px;padding:6px 10px;margin-top:9px;font-size:var(--fs-xs);color:var(--ink2)}
.p-likes svg{width:13px;height:13px;flex-shrink:0}
.p-likes path{fill:var(--blue2)}
.p-comments{background:color-mix(in srgb,var(--blue) 10%,transparent);border-radius:8px;padding:7px 10px;margin-top:6px;font-size:var(--fs-sm);line-height:1.7}
.p-comments .cmt{word-break:break-word}
.p-comments b{color:var(--blue2);font-weight:600}
.cmt-inputrow{display:flex;gap:8px;margin-top:9px}
.cmt-inputrow input{flex:1;border:1.5px solid var(--blue);border-radius:16px;padding:6px 12px;background:var(--card);outline:none;font-size:var(--fs-sm)}
.cmt-inputrow button{background:var(--blue2);color:#fff;border-radius:14px;padding:4px 13px;font-size:var(--fs-xs)}

/* ============ 主屏小豚 ============ */
.home-pages{position:absolute;left:0;top:0;bottom:0;width:200%;z-index:1;display:flex;transition:transform .32s cubic-bezier(.3,.9,.3,1);will-change:transform;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.home-page{width:50%;height:100%;flex-shrink:0;display:flex;flex-direction:column;position:relative}
.page-pol{overflow-y:auto;-webkit-overflow-scrolling:touch}
#home-pages img{-webkit-user-drag:none;-webkit-touch-callout:none}
.page-dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:8px;z-index:6}
.dotp{width:6px;height:6px;border-radius:50%;background:rgba(95,159,221,.4);padding:0;transition:all .25s}
.dotp.on{width:18px;border-radius:4px;background:var(--blue2)}
body[data-theme="night"] .dotp{background:rgba(255,255,255,.28)}

.pol-head{padding:26px 22px 8px;flex-shrink:0}
.pol-title{font-size:var(--fs-xl);font-weight:600;color:var(--ink);letter-spacing:1px}
.pol-sub{font-size:var(--fs-xs);color:var(--ink2);margin-top:4px;letter-spacing:1px}
.pol-wall{flex:1;padding:6px 16px 52px;column-count:2;column-gap:12px}
.pol-card{break-inside:avoid;background:#fff;border-radius:4px;padding:9px 9px 0;margin:0 0 14px;box-shadow:0 7px 18px rgba(70,110,150,.22);transform:rotate(var(--r,-2deg));cursor:pointer;transition:transform .18s}
.pol-card:active{transform:rotate(0) scale(1.03)}
body[data-theme="night"] .pol-card{background:#f3f5f8;box-shadow:0 7px 18px rgba(0,0,0,.5)}
.pol-photo{position:relative;aspect-ratio:1/1;border-radius:2px;overflow:hidden;background:#dfeaf6}
.pol-photo img{width:100%;height:100%;display:block;object-fit:cover}
.pol-doodle{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pol-cap{font-family:"Kaiti SC","STKaiti","KaiTi","楷体","Comic Sans MS",cursive;color:#4a6b8a;font-size:13px;padding:9px 5px 13px;line-height:1.45;word-break:break-word;min-height:18px}
.pol-add{break-inside:avoid;position:relative;border:1.6px dashed var(--blue);border-radius:8px;background:rgba(255,255,255,.66);min-height:158px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--blue2);margin-bottom:14px;cursor:pointer;transform:rotate(2deg);box-shadow:0 6px 14px rgba(70,110,150,.16);transition:transform .18s}
.pol-add:active{transform:rotate(0deg) scale(1.04)}
body[data-theme="night"] .pol-add{background:rgba(255,255,255,.06)}
.pol-add::before{content:'';position:absolute;top:-9px;left:50%;width:54px;height:15px;transform:translateX(-50%) rotate(-5deg);background:rgba(142,194,240,.5);border-radius:2px;box-shadow:0 1px 3px rgba(70,110,150,.18)}
.pol-add svg{width:62px;height:62px}
.pol-add path,.pol-add circle,.pol-add rect{stroke-linecap:round;stroke-linejoin:round}
.pol-add span{font-size:var(--fs-xs);letter-spacing:1px}
.pol-empty-tip{column-span:all;text-align:center;font-size:var(--fs-xs);color:var(--ink2);padding:8px 0 0;letter-spacing:1px}
.pol-lb{background:rgba(12,22,36,.88);padding:30px 26px;display:flex;flex-direction:column;align-items:center;gap:0}
.pol-lb .pol-card{transform:none;cursor:default;width:min(78vw,300px);box-shadow:0 14px 50px rgba(0,0,0,.5)}
.pol-lb .pol-del-btn{margin-top:20px;border:1.5px solid rgba(255,255,255,.7);color:#fff;background:transparent;border-radius:16px;padding:8px 22px;font-size:var(--fs-sm)}
.pol-preview{width:100%;border-radius:4px;background:#fff;padding:9px 9px 0;box-shadow:var(--shadow)}
.pol-preview .pol-cap{text-align:center}
#pol-drawbtn{margin:2px 0 12px}

#home-pet{position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center;min-height:0;cursor:pointer;width:100%}
.pet-wrap{position:relative;width:min(44vw,175px);animation:petFloat 3.6s ease-in-out infinite}
.pet-wrap svg,.pet-big svg{color:var(--blue2)}
#home-pet.gloomy .pet-wrap{animation-duration:5.5s;filter:grayscale(.3) brightness(.96)}
#home-pet.angry .pet-wrap{animation:petShake 2.4s ease-in-out infinite;filter:grayscale(.25)}
.pet-wrap svg{width:100%;display:block}
@keyframes petFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
@keyframes petShake{0%,100%{transform:translateY(0) rotate(-1deg)}30%{transform:translateY(3px) rotate(2.5deg)}60%{transform:translateY(0) rotate(-3deg)}}
.pet-bubble{
  position:absolute;top:-6%;right:-8%;background:var(--card);border:1.5px solid var(--blue);
  border-radius:14px;padding:5px 11px;font-size:var(--fs-xs);color:var(--blue2);white-space:nowrap;
  box-shadow:var(--shadow);animation:bubbleIn .35s ease-out;
}
.pet-bubble::after{content:'';position:absolute;left:-7px;bottom:9px;width:11px;height:11px;background:var(--card);border-left:1.5px solid var(--blue);border-bottom:1.5px solid var(--blue);transform:rotate(45deg);border-bottom-left-radius:3px}
@keyframes bubbleIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.pet-hint{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--ink2);letter-spacing:2px;white-space:nowrap}

/* ============ 电话 ============ */
.phone-row{display:flex;align-items:center;gap:12px;padding:12px 16px}
.phone-row:active{background:var(--bg2)}
.phone-acts{display:flex;gap:10px}
.pcir{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--blue);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--blue2)}
.pcir:active{background:var(--blue-soft)}
.pcir svg{width:19px;height:19px}
.pcir path{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ============ 纪念日 ============ */
.ann-list{padding:14px;display:flex;flex-direction:column;gap:12px}
.ann-card{background:var(--card);border:1.5px solid var(--blue);border-radius:18px;padding:15px 17px;position:relative;box-shadow:var(--shadow);overflow:hidden}
.ann-card::before{content:'';position:absolute;right:-14px;top:-14px;width:64px;height:64px;border-radius:50%;background:color-mix(in srgb,var(--blue) 12%,transparent)}
.ann-name{font-size:var(--fs-md);font-weight:600;color:var(--ink)}
.ann-big{display:flex;align-items:baseline;gap:6px;margin:8px 0 4px}
.ann-big b{font-size:calc(var(--fs-base)*2.1);font-weight:700;color:var(--blue2);line-height:1}
.ann-big span{font-size:var(--fs-sm);color:var(--ink2)}
.ann-sub{font-size:var(--fs-xs);color:var(--ink2)}
.ann-card.today{border-color:var(--blue2);background:var(--blue-soft)}
.ann-del{position:absolute;right:12px;bottom:12px;font-size:var(--fs-xs);color:var(--danger);z-index:2}
.ann-star{position:absolute;right:16px;top:14px;width:18px;height:18px;z-index:2}
.ann-star path{fill:var(--blue2)}

/* ============ 天气 ============ */
.wx-body{flex:1;overflow-y:auto;padding:20px 18px 30px}
.wx-city{font-size:var(--fs-md);color:var(--ink2);display:flex;align-items:center;justify-content:space-between}
.wx-refresh{font-size:var(--fs-xs);color:var(--blue2);border:1.5px solid var(--blue);border-radius:14px;padding:4px 12px;background:var(--card)}
.wx-main{display:flex;flex-direction:column;align-items:center;padding:24px 0 18px}
.wx-icon{width:130px;height:130px}
.wx-icon svg{width:100%;height:100%;color:var(--blue2)}
.wx-temp{font-size:calc(var(--fs-base)*3.4);font-weight:200;color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums}
.wx-desc{font-size:var(--fs-lg);color:var(--ink);margin-top:6px}
.wx-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.wx-mini{background:var(--card);border:1.5px solid color-mix(in srgb,var(--blue) 55%,transparent);border-radius:16px;padding:13px 15px;box-shadow:var(--shadow)}
.wx-mini .l{font-size:var(--fs-xs);color:var(--ink2)}
.wx-mini .v{font-size:var(--fs-lg);color:var(--ink);margin-top:3px;font-weight:600}
.wx-pickrow{display:flex;gap:8px;margin-bottom:10px}
.wx-pickrow input{flex:1}
.wx-results{display:flex;flex-direction:column;gap:8px}
.wx-results button{text-align:left;border:1.5px solid var(--blue);background:var(--card);border-radius:13px;padding:11px 14px;font-size:var(--fs-sm);color:var(--ink)}
.wx-results button:active{background:var(--blue-soft)}

/* ============ 小豚 ============ */
.pet-page{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:24px 22px 30px}
.pet-big{width:min(64vw,250px);animation:petFloat 3.4s ease-in-out infinite}
.pet-big svg{width:100%}
.pet-page.gloomy .pet-big{animation-duration:5.5s;filter:grayscale(.3)}
.pet-page.angry .pet-big{animation:petShake 2.4s ease-in-out infinite}
.pet-mood{font-size:var(--fs-lg);font-weight:600;margin:14px 0 6px;text-align:center}
.pet-says{font-size:var(--fs-sm);color:var(--ink2);text-align:center;line-height:1.8;min-height:48px;max-width:300px}
.pet-aff{display:flex;align-items:center;gap:6px;margin:10px 0 18px;font-size:var(--fs-sm);color:var(--blue2)}
.pet-aff svg{width:14px;height:14px}
.pet-aff path{fill:var(--blue2)}
.pet-btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:280px}
.pet-btns .btn{width:100%;text-align:center}
.pet-hearts{position:absolute;pointer-events:none;font-size:22px;animation:heartUp 1s ease-out forwards}
@keyframes heartUp{to{transform:translateY(-70px) scale(1.3);opacity:0}}

/* ============ 相册 ============ */
.alb-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px}
.alb-card{background:var(--card);border:1.5px solid var(--blue);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);position:relative}
.alb-card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;cursor:pointer}
.alb-info{padding:9px 11px 11px}
.alb-mood{font-size:var(--fs-sm);line-height:1.5;color:var(--ink);word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.alb-meta{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.alb-date{font-size:10px;color:var(--ink2)}
.alb-num{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--blue2);background:color-mix(in srgb,var(--blue) 14%,transparent);padding:2px 7px;border-radius:9px}
.alb-num svg{width:9px;height:9px}
.alb-num path{fill:var(--blue2)}
.alb-del{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}

/* ============ 设置 ============ */
.set-body{flex:1;overflow-y:auto;padding:14px 16px 40px}
.set-group{background:var(--card);border:1.5px solid color-mix(in srgb,var(--blue) 55%,transparent);border-radius:18px;padding:4px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.set-row{padding:15px 0;border-bottom:1px solid color-mix(in srgb,var(--blue) 18%,transparent)}
.set-row:last-child{border-bottom:none}
.set-label{font-size:var(--fs-sm);color:var(--ink);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.set-label .val{color:var(--blue2);font-size:var(--fs-xs)}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px}
.seg button{flex:1;padding:8px 0;border-radius:10px;font-size:var(--fs-sm);color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--blue2);font-weight:600;box-shadow:0 1px 5px rgba(95,159,221,.2)}
input[type=range]{width:100%;accent-color:var(--blue2);height:26px}
.f-input{width:100%;border:1.5px solid color-mix(in srgb,var(--blue) 70%,transparent);background:var(--bg);border-radius:12px;padding:10px 12px;outline:none;margin-bottom:10px}
.f-input:focus{border-color:var(--blue2)}
textarea.f-input{resize:vertical;min-height:70px;line-height:1.6}
.btn{display:inline-block;background:var(--blue2);color:#fff;border-radius:14px;padding:9px 20px;font-size:var(--fs-sm)}
.btn.ghost{background:transparent;color:var(--blue2);border:1.5px solid var(--blue2)}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn:disabled{opacity:.5}
#api-status{font-size:var(--fs-xs);margin-top:2px;min-height:16px}
#api-status.ok{color:#5cb87a}
#api-status.bad{color:var(--danger)}

/* ============ 弹层 ============ */
.overlay{position:absolute;inset:0;background:rgba(10,20,35,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.overlay.center{align-items:center;padding:24px}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--card);width:100%;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  max-height:88%;overflow-y:auto;animation:sheetUp .25s cubic-bezier(.3,.9,.3,1);
}
.overlay.center .modal{border-radius:22px;max-width:340px;margin:auto}
@keyframes sheetUp{from{transform:translateY(60%)}to{transform:none}}
.m-title{font-size:var(--fs-md);font-weight:600;text-align:center;margin-bottom:16px}
.sheet-list button{display:flex;width:100%;align-items:center;gap:12px;padding:14px 8px;font-size:var(--fs-md);color:var(--ink);border-bottom:1px solid color-mix(in srgb,var(--blue) 15%,transparent)}
.sheet-list button:last-child{border-bottom:none}
.sheet-list button.danger{color:var(--danger)}
.f-label{font-size:var(--fs-xs);color:var(--ink2);margin:10px 0 6px;display:block}
.f-imgpick{border:1.5px dashed var(--blue);border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;color:var(--blue2);background:var(--bg);cursor:pointer}
.f-imgpick img{width:52px;height:52px;border-radius:12px;object-fit:cover;border:1.5px solid var(--blue)}
.f-imgpick span{font-size:var(--fs-sm)}
.f-err{color:var(--danger);font-size:var(--fs-xs);min-height:16px;margin-top:4px}
.radio-row{display:flex;gap:8px}
.radio-row button{flex:1;border:1.5px solid var(--blue);border-radius:12px;padding:9px 0;font-size:var(--fs-sm);color:var(--ink2);background:var(--card)}
.radio-row button.on{background:var(--blue-soft);color:var(--blue2);border-color:var(--blue2);font-weight:600}
.m-btns{display:flex;gap:10px;margin-top:18px}
.m-btns .btn{flex:1;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1.5px solid var(--blue);border-radius:16px;padding:6px 13px;font-size:var(--fs-xs);color:var(--ink2);background:var(--card)}
.chips button.on{background:var(--blue-soft);color:var(--blue2);border-color:var(--blue2)}
.toast{
  position:absolute;left:50%;top:16%;transform:translateX(-50%);z-index:99;background:rgba(25,35,50,.82);color:#fff;
  padding:9px 18px;border-radius:20px;font-size:var(--fs-sm);max-width:80%;text-align:center;animation:fade .2s;backdrop-filter:blur(6px);
}
.lightbox{z-index:99;background:rgba(0,0,0,.85);align-items:center}
.lightbox img{max-width:94%;max-height:88%;border-radius:10px}

/* 好友申请流程 */
.fr-end{display:flex;flex-direction:column;align-items:center;padding:30px 0 10px;gap:14px}
.fr-check{width:64px;height:64px;border-radius:50%;border:2px solid #5cb87a;display:flex;align-items:center;justify-content:center}
.fr-check svg{width:30px;height:30px}
.fr-check path{fill:none;stroke:#5cb87a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

/* ============ 通话 ============ */
.callov{position:absolute;inset:0;z-index:70;display:none;flex-direction:column;background:linear-gradient(180deg,#f6fafd,#dcebf9)}
body[data-theme="night"] .callov{background:linear-gradient(180deg,#0c0e12,#131924)}
.callov.open{display:flex;animation:fade .25s}
.callov.novideo #call-self{display:none}
.call-top{text-align:center;padding:56px 0 4px}
.call-name{font-size:var(--fs-xl);font-weight:600}
.call-status{font-size:var(--fs-sm);color:var(--ink2);margin-top:6px}
#call-self{
  position:absolute;top:52px;right:16px;width:86px;height:118px;border-radius:14px;background:#101216;
  border:1.5px solid var(--blue);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;z-index:5;
}
#call-self img{width:100%;height:100%;object-fit:cover}
#call-self span{color:#5a6b7d;font-size:10px}
.call-mid{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.call-ava-wrap{position:relative;width:170px;height:170px;display:flex;align-items:center;justify-content:center}
.call-ava-wrap::before{content:'';position:absolute;inset:-14px;border-radius:50%;border:1.5px solid var(--blue);opacity:.5;animation:ring 2.6s ease-out infinite}
.call-ava-wrap::after{content:'';position:absolute;inset:-28px;border-radius:50%;border:1px solid var(--blue);opacity:.25;animation:ring 2.6s .5s ease-out infinite}
@keyframes ring{from{transform:scale(.85);opacity:.6}to{transform:scale(1.12);opacity:0}}
#call-ava{width:150px;height:150px;border-radius:50%;object-fit:cover;border:2px solid var(--blue);background:var(--card)}
.call-log{max-height:150px;overflow-y:auto;padding:0 18px 8px;display:flex;flex-direction:column;gap:7px}
.call-bubble{max-width:78%;padding:7px 13px;border-radius:14px;font-size:var(--fs-sm);line-height:1.5;white-space:pre-wrap;word-break:break-word;animation:fade .25s}
.call-bubble.ai{align-self:flex-start;background:var(--card);border:1.5px solid var(--blue)}
.call-bubble.me{align-self:flex-end;background:var(--bubble-me);border:1.5px solid var(--blue)}
.call-bottom{padding:6px 16px calc(18px + env(safe-area-inset-bottom))}
.call-inputrow{display:flex;gap:8px;margin-bottom:14px}
#call-input{flex:1;border:1.5px solid var(--blue);background:var(--card);border-radius:20px;padding:9px 15px;outline:none}
#call-send{background:var(--blue2);color:#fff;border-radius:18px;padding:7px 15px;font-size:var(--fs-sm)}
.call-btns{display:flex;justify-content:center;gap:46px}
.cbtn{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink2);font-size:var(--fs-xs)}
.cbtn .cir{width:54px;height:54px;border-radius:50%;border:1.5px solid var(--blue);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--blue2)}
.cbtn svg{width:24px;height:24px}

/* ---------- 北京时间 ---------- */
const BJF=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',weekday:'long',hourCycle:'h23'});
function bjParts(ts){const o={};BJF.formatToParts(ts?new Date(ts):new Date()).forEach(p=>o[p.type]=p.value);return o}
const bjClock=ts=>{const p=bjParts(ts);return p.hour+':'+p.minute};
const bjDateCN=ts=>{const p=bjParts(ts);return (+p.year)+'年'+(+p.month)+'月'+(+p.day)+'日 '+p.weekday};
const bjSameDay=(a,b)=>{const x=bjParts(a),y=bjParts(b);return x.year===y.year&&x.month===y.month&&x.day===y.day};
function bjYesterday(ts){const p=bjParts(ts),y=bjParts(Date.now()-864e5);return p.year===y.year&&p.month===y.month&&p.day===y.day}
function fmtListTime(ts){if(!ts)return'';const diff=Date.now()-ts;
  if(diff<6e4)return'刚刚';if(diff<36e5)return Math.floor(diff/6e4)+'分钟前';
  if(bjSameDay(ts))return bjClock(ts);if(bjYesterday(ts))return'昨天';
  const p=bjParts(ts);return (+p.month)+'月'+(+p.day)+'日'}
function fmtChatTime(ts){const p=bjParts(ts);
  if(bjSameDay(ts))return p.hour+':'+p.minute;
  if(bjYesterday(ts))return'昨天 '+p.hour+':'+p.minute;
  const n=bjParts();const base=(+p.month)+'月'+(+p.day)+'日 '+p.hour+':'+p.minute;
  return p.year===n.year?base:(+p.year)+'年'+base}
function agoStr(ts){if(!ts)return'还没有聊过';const diff=Date.now()-ts;
  if(diff<36e5)return Math.max(1,Math.floor(diff/6e4))+' 分钟前';
  if(diff<864e5)return Math.floor(diff/36e5)+' 小时前';
  return Math.floor(diff/864e5)+' 天前'}
function fmtDur(ms){const s=Math.floor(ms/1e3);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function bjDateOf(y,m,d){return new Date(`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}T00:00:00+08:00`).getTime()}
function bjToday0(){const p=bjParts();return bjDateOf(+p.year,+p.month,+p.day)}
function bjDayDiff(ts){return Math.round((ts-bjToday0())/864e5)}
function bjTodayStr(){const p=bjParts();return p.year+'-'+p.month+'-'+p.day}
function annInfo(a){
  const p=bjParts(),y=+p.year;
  if(a.type==='recurring'){
    const[m,d]=a.date.split('-').map(Number);
    let t=bjDateOf(y,m,d);if(t<bjToday0())t=bjDateOf(y+1,m,d);
    return{diff:bjDayDiff(t),target:t,label:(+m)+'月'+(+d)+'日'};
  }
  const[yy,mm,dd]=a.date.split('-').map(Number);
  const t=bjDateOf(yy,mm,dd);
  return{diff:bjDayDiff(t),target:t,label:mm+'月'+dd+'日'};
}

/* ---------- 主屏左右滑动 ---------- */
let hpIndex=0;
function homePageW(){return $('#home-pages').parentElement.clientWidth}
function setHomePage(i,animate=true){
  hpIndex=i;
  const tr=$('#home-pages');
  tr.style.transition=animate?'':'none';
  tr.style.transform=`translateX(${-i*homePageW()}px)`;
  $$('.dotp').forEach((d,k)=>d.classList.toggle('on',k===i));
}
function initHomePages(){
  const tr=$('#home-pages');
  let sx=0,sy=0,dx=0,ldy=0,lock=null,dragging=false,W=0,guard=false,guardTimer=0;
  setHomePage(0,false);
  const begin=(x,y)=>{dragging=true;sx=x;sy=y;dx=0;ldy=0;lock=null;W=tr.parentElement.clientWidth||0};
  const move=(x,y)=>{
    if(!dragging)return;
    dx=x-sx;ldy=y-sy;
    if(lock===null){
      if(Math.abs(dx)>9&&Math.abs(dx)>Math.abs(ldy)*1.15)lock='x';
      else if(Math.abs(ldy)>9&&Math.abs(ldy)>Math.abs(dx)*1.15)lock='y';
    }else if(lock==='y'&&Math.abs(dx)>28&&Math.abs(dx)>Math.abs(ldy)*1.6)lock='x';
    if(lock==='x'){
      tr.style.transition='none';
      const px=Math.max(-W*1.15,Math.min(W*.15,-hpIndex*W+dx));
      tr.style.transform=`translateX(${px}px)`;
      if(Math.abs(dx)>12){guard=true;clearTimeout(guardTimer)}
    }
  };
  const end=()=>{
    if(!dragging)return;dragging=false;
    let treat=lock;
    if(treat!=='x'&&Math.abs(dx)>60&&Math.abs(dx)>Math.abs(ldy)*1.3)treat='x';
    if(treat==='x'){
      const t=W*.15;
      let next=hpIndex;
      if(dx<=-t)next=1;else if(dx>=t)next=0;
      else if(Math.abs(dx)>44)next=dx<0?1:0;
      setHomePage(next);
      if(guard){guardTimer=setTimeout(()=>guard=false,360)}
    }
  };
  tr.addEventListener('pointerdown',e=>{
    if(e.target.closest('.dotp'))return;
    begin(e.clientX,e.clientY);
  });
  document.addEventListener('pointermove',e=>move(e.clientX,e.clientY));
  document.addEventListener('pointerup',end);
  document.addEventListener('pointercancel',end);
  tr.addEventListener('dragstart',e=>e.preventDefault());
  if(!window.PointerEvent){
    tr.addEventListener('touchstart',e=>{const t=e.touches[0];begin(t.clientX,t.clientY)},{passive:true});
    tr.addEventListener('touchmove',e=>{
      if(!dragging)return;
      const t=e.touches[0];
      if(lock==='x')e.preventDefault();
      move(t.clientX,t.clientY);
    },{passive:false});
    tr.addEventListener('touchend',end);tr.addEventListener('touchcancel',end);
  }
  tr.addEventListener('click',e=>{
    if(guard){e.stopPropagation();e.preventDefault();guard=false}
  },true);
  $$('.dotp').forEach(d=>d.addEventListener('click',()=>setHomePage(+d.dataset.go)));
  window.addEventListener('resize',()=>setHomePage(hpIndex,false));
}

  box.querySelectorAll('[data-cmt]').forEach(b=>b.addEventListener('click',()=>{

  box.querySelectorAll('[data-cmtsend]').forEach(b=>b.addEventListener('click',()=>{

  }));

function sendComment(postId,text){
  if(!text)return;
  const p=S.moments.find(x=>x.id===postId);if(!p)return;
  p.comments=p.comments||[];
  p.comments.push({by:'me',text,t:Date.now()});
  save();renderMoments();
  const ag=agentById(p.by);
  if(ag)agentComment(ag,p,`对方评论了你的朋友圈「${p.text||''}」，评论内容是：「${text}」。请以该角色身份回一条评论（20字内，只要评论内容本身，符合人设和当前心情）。`);
}
function extractAts(text){
  const out=[];(text.match(/@([\w\u4e00-\u9fa5·]+)/g)||[]).forEach(m=>{
    const name=m.slice(1);const ag=S.agents.find(a=>a.remark===name||a.name===name);
    if(ag&&!out.includes(ag))out.push(ag)});
  return out;
}
async function agentComment(ag,post,instruction){
  post.comments=post.comments||[];
  const tmp={by:ag.id,text:'…',t:Date.now()};
  post.comments.push(tmp);renderMoments();
  try{
    const sys=buildSys(ag,'comment');
    const out=await callLLM(sys,[{role:'user',content:instruction}],{max:120});
    tmp.text=cleanOut(out,ag);
  }catch(e){tmp.text='（网络开小差了，稍后再试）'}
  save();renderMoments();
}
async function postUserMoment(text,imgs){
  const ats=extractAts(text);
  const p={id:uid(),by:'me',text,imgs,t:Date.now(),likes:[],comments:[]};
  S.moments.unshift(p);save();renderMoments();
  ats.forEach((ag,i)=>setTimeout(()=>{
    agentComment(ag,p,`对方发了朋友圈并@了你：「${text||'（图片动态）'}」。请在评论区回应一下（20字内，只要评论内容，符合人设）。`);
  },900+i*1400));
  if(!ats.length&&S.agents.length&&Math.random()<.4){
    const ag=S.agents[Math.floor(Math.random()*S.agents.length)];
    setTimeout(()=>agentComment(ag,p,`对方发了条朋友圈：「${text||'（图片动态）'}」。如果你感兴趣就以角色身份评论一句（20字内，只要评论内容），不想评论就输出“[skip]”。`),1600);
  }
}
async function agentPost(ag){
  if(BUSY[ag.id])return;
  try{
    BUSY[ag.id]=true;
    const sys=buildSys(ag,'moments');
    const out=await callLLM(sys,[{role:'user',content:'现在请发一条朋友圈动态。结合你的人设、你们的共同记忆和当前心情，40字以内，口语化，可以有颜文字。只输出动态内容本身，不要图片、不要解释、不要引号。'}],{max:120});
    const text=cleanOut(out,ag);if(!text)return;
    S.moments.unshift({id:uid(),by:ag.id,text,imgs:[],t:Date.now(),likes:[],comments:[]});
    ag.lastPost=Date.now();save();
    if($('#page-moments').classList.contains('open'))renderMoments();
  }catch(e){}finally{BUSY[ag.id]=false}
}

    const c=DRAW_COLORS[i%DRAW_COLORS.length];

    return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${sc})" fill="${fill?c:'none'}" stroke="${c}" stroke-width="${fill?0:2.3}" stroke-linecap="round" stroke-linejoin="round"><path d="${DRAW_PAT[k]}"/></g>`;
  }).join('');
  const dots=Array.from({length:6},()=>`<circle cx="${(8+Math.random()*84).toFixed(1)}" cy="${(8+Math.random()*84).toFixed(1)}" r="${(0.7+Math.random()*0.9).toFixed(2)}" fill="${DRAW_COLORS[Math.floor(Math.random()*DRAW_COLORS.length)]}" opacity=".7"/>`).join('');

/* ---------- 图片工具 ---------- */
function pickFiles(accept='image/*',multiple=false){
  return new Promise(res=>{
    const inp=document.createElement('input');
    inp.type='file';inp.accept=accept;inp.multiple=multiple;inp.style.display='none';
    inp.addEventListener('change',()=>{res(inp.files);inp.remove()});
    document.body.appendChild(inp);inp.click();
  });
}
function imgToDataURL(file,maxDim=800,q=.75){
  return new Promise(res=>{
    if(!file)return res('');
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const cv=document.createElement('canvas');
        const ctx=cv.getContext('2d');
        let qw=q,dm=maxDim;
        const enc=()=>{
          const sc=Math.min(1,dm/Math.max(img.width,img.height));
          cv.width=Math.max(1,Math.round(img.width*sc));
          cv.height=Math.max(1,Math.round(img.height*sc));
          ctx.drawImage(img,0,0,cv.width,cv.height);
          return cv.toDataURL('image/jpeg',qw);
        };
        let out=(file.size<200*1024&&file.type!=='image/heic')?reader.result:enc();
        let tries=0;
        while(out.length>150000&&tries<5){
          tries++;
          if(qw>.55)qw=Math.max(.55,qw-.1);else dm=Math.round(dm*.78);
          out=enc();
        }
        res(out);
      };
      img.onerror=()=>res(reader.result);
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function pickImage(maxDim=800,q=.75){
  const files=await pickFiles();if(!files||!files.length)return '';
  return imgToDataURL(files[0],maxDim,q);
}

}

async function callLLM(sys,hist,opts={}){
  const c=apiCfg();
  const url=c.url.replace(/\/+$/,'')+'/chat/completions';
  let res;
  try{
    res=await fetch(url,{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.key},
      body:JSON.stringify({model:c.model,messages:[{role:'system',content:sys},...hist],
        temperature:opts.temp??0.95,max_tokens:opts.max??400})});
  }catch(e){throw'网络错误，检查地址'}
  if(!res.ok){
    let d='HTTP '+res.status;
    try{const j=await res.json();d=j.error?.message||j.message||d}catch(e){}
    throw d;
  }
  const j=await res.json();
  const out=j.choices?.[0]?.message?.content;
  if(!out)throw'返回为空';
  return out;
}

  parts.push('你在「LUU-AI」这个聊天应用里扮演角色，和用户微信式聊天。完全沉浸在角色里，永远不要说自己是AI/模型/程序/助手。');
  parts.push('【你的角色档案】\n'+ag.bio
    +(ag.persona?('\n人设补充：'+ag.persona):'')
    +(ag.speech?('\n说话方式：'+ag.speech):'')
    +(ag.replyStyle?('\n回复风格要求：'+ag.replyStyle):''));
  parts.push('【用户档案】昵称：'+(S.me.name||'我')
    +(S.me.persona?('\n人设/性格：'+S.me.persona):'')
    +(S.me.speech?('\n说话方式：'+S.me.speech):'')
    +(S.me.likes?('\n喜好：'+S.me.likes):''));
  parts.push('【当前状态】现在北京时间 '+bjClock()+' '+bjDateCN().split(' ')[1]
    +'。对方上次发消息：'+agoStr(e.lastUser)
    +'。你当前心情：'+MOOD_TXT[mood]);
  if((e.awkward||0)>0)parts.push('（你刚被哄好，还有点别扭：嘴硬、口是心非，但心已经软了，会慢慢恢复自然。当前别扭程度 '+e.awkward+'/3）');
  parts.push('【长期记忆（你们聊天的总结）】'+(ag.summary||'暂无，慢慢积累'));
  const mm=S.moments.slice(0,5).map(p=>{
    const n=p.by==='me'?(S.me.name||'我'):((agentById(p.by)||{}).remark||'?');
    return n+'：'+(p.text||'[图片]')+'（评论'+(p.comments?.length||0)+'条）'}).join('\n');
  if(mm)parts.push('【朋友圈近况】\n'+mm+'\n（可以在聊天里非常偶尔自然地提到这些，不要每次都提）');
  const alb=S.album.slice(0,5).map(c=>c.date+' '+(c.num?'['+c.num+'] ':'')+(c.mood||'')).join('\n');
  if(alb)parts.push('【纪念册】\n'+alb);
  /* 天气 */
  if(S.weather&&S.weather.current){
    const c=S.weather.current,code=c.weather_code??0;
    const[wd]=WMO[code]||[''];
    parts.push('【天气】'+S.weather.name+' 现在 '+Math.round(c.temperature_2m)+'°，'+wd+'，体感 '+Math.round(c.apparent_temperature??c.temperature_2m)+'°。聊到出门、穿衣时可以自然地关心，但不要每次都提天气。');
  }
  /* 近期纪念日（30天内） */
  const soon=S.anniversaries.map(a=>({a,i:annInfo(a)})).filter(x=>x.a.type!=='countup'&&x.i.diff>=0&&x.i.diff<=30)
    .sort((x,y)=>x.i.diff-y.i.diff);
  if(soon.length){
    parts.push('【近期纪念日】\n'+soon.map(x=>{
      if(x.i.diff===0)return'今天就是「'+x.a.name+'」！'+(x.a.built?'（王橹杰生日，他今天满'+ageAt(x.a)+'岁，会非常期待祝福和撒娇）':'');
      return'「'+x.a.name+'」还有 '+x.i.diff+' 天（'+x.i.label+'）'+(x.a.built?'，他心里可能在偷偷期待生日祝福':'');
    }).join('\n'));
  }
  if(kind==='call')parts.push('【通话模式】你们正在'+(CALL.kind==='video'?'视频':'语音')+'通话中。像打电话一样说话：每次只说1~2句口语短句，自然随意，可以有语气词，不要长段落，不要列点。');
  if(kind==='proactive')parts.push('【主动消息规则】这是你主动发消息，不是回复。根据你们的记忆自然地开口，1~2句话，符合人设和当前心情。只输出消息内容。');
  if(kind==='moments')parts.push('【朋友圈规则】只输出朋友圈动态内容本身，40字以内，不要解释。以你的日常为主：练习、生活、心情、小牢骚、四芒星云和小豚。大约三分之一的时候可以隐晦地提到何贝贝——但不要直接说她名字、不要直白说"喜欢/想你"，而是用"某人""有个人""某个笨蛋"、只她能懂的小事或暧昧的心情暗示，让她刷到时心里一动；其余动态不要强行带她。');
  if(kind==='comment')parts.push('【评论规则】只输出一条评论内容，20字以内，不要引号不要解释。');
  if(!kind||kind==='chat')parts.push('【聊天规则】像真实微信聊天：口语化、简短自然（通常1~2句话）、符合人设地用颜文字、不要书面腔、不要列点、不要复述对方的话、不要输出"角色名:"前缀。只输出你发送的消息内容。');
  return parts.join('\n\n');
}
function ctxText(m){
  if(m.type==='image')return m.role==='user'?'[我发送了一张图片]':'[图片]';
  if(m.type==='sticker')return m.role==='user'?'[我发了个表情包：'+(m.meaning||'')+']':'[表情包：'+(m.meaning||'')+']';
  if(m.type==='transfer')return m.role==='user'?('[我给你转账 ¥'+m.amount+']'):'[转账]';
  if(m.type==='note')return '[系统提示：'+m.text+']';
  return m.text;
}
function ctxHistory(ag,n=24){
  return (S.chats[ag.id]||[]).slice(-n).filter(m=>m.type!=='note'||true)
    .map(m=>({role:m.role,content:ctxText(m)}));
}
async function aiReply(ag,opts={}){
  if(BUSY[ag.id])return;
  BUSY[ag.id]=true;
  showTyping(ag);
  try{
    const sys=buildSys(ag,opts.kind||'chat');
    const hist=ctxHistory(ag,opts.len||24);
    const out=await callLLM(sys,hist,{max:opts.max||300});
    await sleep(400+Math.random()*700);
    const text=cleanOut(out,ag);
    pushMsg(ag,{role:'assistant',type:'text',text,t:Date.now()});
    const e=S.emotion[ag.id];
    if(e&&e.awkward>0)e.awkward--;
    save();
    if(curChat===ag.id)renderChat();else{aUnread(ag)}
    if(wcCurTab==='chats')renderChatList();
  }catch(e){
    toast('发送失败：'+e);
  }finally{hideTyping();BUSY[ag.id]=false}
}
function aUnread(ag){ag.unread=(ag.unread||0)+1;renderHome();if($('#app-wechat').classList.contains('open'))renderChatList()}

/* ---------- 情绪机制 ---------- */
function isCoax(t){
  const K=['对不起','抱歉','别生气','不要生气','消消气','哄哄','抱抱','摸摸头','亲亲','原谅','我错了','是我的错','呜呜','想你了','想你','爱你','喜欢你','别难过','开心一点','拜托','求你','错啦','对不起嘛','好啦好啦'];
  return K.some(k=>t.includes(k));
}
function onUserMsg(ag,text){
  const e=S.emotion[ag.id]=S.emotion[ag.id]||{lastUser:0,mood:0,awkward:0,idleNudged:false,dailyNudged:0};
  const idle=Date.now()-(e.lastUser||0);
  const base=!e.lastUser?0:idle>=7*864e5?3:idle>=3*864e5?2:idle>=864e5?1:0;
  if(base>e.mood)e.mood=base;
  e.lastUser=Date.now();
  e.idleNudged=false;
  let warmed=false;
  if(e.mood>0&&isCoax(text)){e.mood--;warmed=true;if(e.mood===0)e.awkward=3}
  save();
  return {mood:e.mood,warmed};
}

function msgHTML(m,prevT){
  let html='';
  if(!prevT||m.t-prevT>5*6e4)html+=`<div class="msg-date">${fmtChatTime(m.t)}</div>`;
  if(m.type==='note')return html+`<div class="msg note-msg"><div class="msg-note">${esc(m.text)}</div></div>`;
  const me=m.role==='user';
  const ag=agentById(curChat);
  const ava=me?(S.me.avatar||defaultAvatar('me')):(ag&&ag.avatar)||defaultAvatar(curChat);
  let content='';
  if(m.type==='image')content=`<img class="msg-img" src="${m.img}" data-lb>`;
  else if(m.type==='sticker')content=`<img class="stk" src="${m.img}" title="${esc(m.meaning||'')}" data-lb>`;
  else if(m.type==='transfer')content=`<div class="t-card"><div class="t-top"><span class="t-y">¥</span><b>${esc(m.amount)}</b></div><div class="t-note">${me?'转账给 '+esc(ag.remark):'收到转账'} · 已到账</div></div>`;
  else content=nl2br(m.text);
  return html+`<div class="msg ${me?'me':'ai'}">
    <img class="ava" src="${ava}">
    <div class="bubble">${content}</div>
  </div>`;
}

async function summarize(ag){
  const msgs=(S.chats[ag.id]||[]).slice(ag.sumUpTo||0);
  if(!msgs.length)return toast('没有新的聊天内容');
  if(!apiOk())return toast('请先测试连接 API');
  toast('总结中…');
  try{
    const ctx=msgs.map(m=>(m.role==='user'?'我':ag.remark)+': '+ctxText(m)).join('\n').slice(-6000);
    const out=await callLLM('你是记忆管家。请把以下微信聊天记录总结成第三人称的要点式长期记忆（包括：双方关系与氛围、聊过的话题、重要信息和约定、情绪事件、对方的喜好），400字以内。只输出总结内容：\n\n'+ctx,[],{max:600,temp:0.5});
    ag.summary=((ag.summary?ag.summary+'\n':'')+'【'+bjDateCN()+'更新】'+cleanOut(out,ag)).slice(-2000);
    ag.sumUpTo=(S.chats[ag.id]||[]).length;
    save();toast('总结已保存，之后聊天不会忘');
  }catch(e){toast('总结失败：'+e)}
}

  toast('头像已更新');
});
$('#call-speaker').addEventListener('click',()=>$('#call-speaker').classList.toggle('on'));
function callSend(){
  const inp=$('#call-input'),text=inp.value.trim();
  if(!text||!CALL.ag)return;
  const ag=CALL.ag;
  if(!apiOk()){toast('请先在设置里测试连接 API');return}
  inp.value='';
  const log=$('#call-log');
  log.insertAdjacentHTML('beforeend',`<div class="call-bubble me">${nl2br(text)}</div>`);
  log.scrollTop=log.scrollHeight;
  pushMsg(ag,{role:'user',type:'text',text,t:Date.now()});
  onUserMsg(ag,text);
  callAsk(ag,log);
}
async function callAsk(ag,log){
  const tip=document.createElement('div');tip.className='call-bubble ai';tip.textContent='…';
  log.appendChild(tip);log.scrollTop=log.scrollHeight;
  try{
    const sys=buildSys(ag,'call');
    const out=await callLLM(sys,ctxHistory(ag,16),{max:120});
    tip.textContent=cleanOut(out,ag);
    pushMsg(ag,{role:'assistant',type:'text',text:tip.textContent,t:Date.now()});
  }catch(e){tip.textContent='（信号不好：'+e+'）'}
  log.scrollTop=log.scrollHeight;
}
$('#call-send').addEventListener('click',callSend);
$('#call-input').addEventListener('keydown',e=>{if(e.key==='Enter')callSend()});

/* ---------- 添加联系人 ---------- */

    <div class="m-title">创建智能体</div>
    <div class="f-imgpick" id="ac-ava"><span>选择头像</span></div>
    <span class="f-label">昵称 *</span>

    <input class="f-input" id="ac-remark" placeholder="你给 TA 的备注（默认同昵称）">
    <span class="f-label">人设</span>
    <textarea class="f-input" id="ac-persona" placeholder="性格、背景、口头禅…"></textarea>
    <span class="f-label">说话方式</span>
    <textarea class="f-input" id="ac-speech" placeholder="例如：说话软软的喜欢用颜文字"></textarea>

function showFriendRequest(name,ava,data){
  const ov=overlay(`
    <div class="fr-end" style="min-height:220px;justify-content:center">
      <img class="ava" src="${ava||defaultAvatar(name)}" style="width:74px;height:74px">
      <div style="font-size:var(--fs-md)">正在向 <b>${esc(name)}</b> 发送好友申请…</div>
      <div id="fr-state" style="color:var(--ink2);font-size:var(--fs-sm)">等待对方通过</div>
    </div>`,false);
  setTimeout(()=>{
    ov.querySelector('.fr-end').innerHTML=`
      <div class="fr-check"><svg viewBox="0 0 24 24"><path d="M4.5 12.5l5 5 10-11"/></svg></div>
      <div style="font-size:var(--fs-lg);font-weight:600">${esc(name)}</div>
      <div style="color:var(--ink2);font-size:var(--fs-sm)">已通过你的好友申请</div>
      <button class="btn" id="fr-start">发消息</button>`;
    ov.querySelector('#fr-start').addEventListener('click',()=>{
      const id='agent_'+uid();
      S.agents.push({id,name:data.name,remark:data.remark,avatar:ava,
        bio:'姓名：'+data.name+'\n人设：'+(data.persona||'一个可爱的智能体好友')+'\n说话方式：'+(data.speech||'自然口语'),
        persona:data.persona,speech:data.speech,replyStyle:'',freq:'sometimes',
        summary:'',sumUpTo:0,unread:0,wallpaper:'',createdAt:Date.now(),greeted:false,lastPost:0});
      S.chats[id]=[];
      S.emotion[id]={lastUser:0,mood:0,awkward:0,idleNudged:false,dailyNudged:0,wxNudged:''};
      save();ov.remove();openChat(id);
    });
  },1400);
}

/* ---------- 主动消息引擎 ---------- */
async function proactive(ag,hint){
  if(BUSY[ag.id])return;
  try{
    BUSY[ag.id]=true;
    const sys=buildSys(ag,'proactive');
    const out=await callLLM(sys,[{role:'user',content:'主动给对方发一条消息（场景：'+hint+'）。结合你们的长期记忆、朋友圈近况和当前心情，自然开口，1~2句话。只输出消息内容。'}],{max:150});
    const text=cleanOut(out,ag);if(!text)return;
    pushMsg(ag,{role:'assistant',type:'text',text,t:Date.now()});
    if(curChat!==ag.id){aUnread(ag)}else{renderChat();scrollBottom()}
    if(wcCurTab==='chats')renderChatList();
  }catch(e){}finally{BUSY[ag.id]=false}
}
let lastTick=0;
async function tick(){
  const now=Date.now();
  if(now-lastTick<30000)return;lastTick=now;
  if(!apiOk())return;
  for(const ag of S.agents){
    if(BUSY[ag.id])continue;
    const msgs=S.chats[ag.id]||[];
    const last=msgs[msgs.length-1];
    const ref=last?last.t:(ag.createdAt||now);
    const idle=now-ref;
    const e=S.emotion[ag.id]=S.emotion[ag.id]||{lastUser:0,mood:0,awkward:0,idleNudged:false,dailyNudged:0};
    /* 话题告一段落 / 聊完一段时间 */
    if(last&&last.role==='user'&&idle>25*6e4&&idle<3*36e5&&!e.idleNudged){
      e.idleNudged=true;save();
      await proactive(ag,'你们刚聊完一阵，话题告一段落了，你有点想继续说话');
      continue;
    }
    /* 隔段时间没聊 */
    if(idle>20*36e5&&now-(e.dailyNudged||0)>20*36e5){
      e.dailyNudged=now;save();
      await proactive(ag,'你们很久没聊了（超过一天），你想TA了，主动找TA说话');
      continue;
    }
    /* 天气关心：恶劣天气/极端温度，每天最多一次，白天时段 */
    const hour=+bjParts().hour;
    const hint=weatherCareHint();
    if(hint&&e.wxNudged!==bjTodayStr()&&hour>=8&&hour<=22){
      e.wxNudged=bjTodayStr();save();
      await proactive(ag,'天气关心：'+hint+'。用你的人设主动发一条关心消息，不要播报天气预报，要像真人一样随口关心');
      continue;
    }
    /* 朋友圈自动发 */
    if(ag.freq!=='never'&&now-(ag.lastPost||0)>2*36e5&&Math.random()<(ag.freq==='often'?0.03:0.012)){
      agentPost(ag);
    }
  }
}
setInterval(tick,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(tick,1500)});
